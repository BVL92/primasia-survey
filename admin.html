<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>犇亞證券 | 投資調查後台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#1B2F6E;--navy-d:#0D1B3E;--navy-l:#2D4A8E;--navy-pale:#EEF2FF;
  --gold:#C9A44A;--gold-l:#E8C96A;--gold-pale:#FDF6E3;
  --white:#fff;--g50:#F8FAFC;--g100:#F1F5F9;--g200:#E2E8F0;
  --g400:#94A3B8;--g500:#64748B;--g600:#475569;--g800:#1E293B;
  --green:#10B981;--red:#EF4444;--orange:#F59E0B;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif;background:var(--g50);color:var(--g800);}

/* ── ADMIN LOGIN ── */
#adminLogin{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(150deg,var(--navy-d),var(--navy),var(--navy-d));padding:20px;}
#adminLogin::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(201,164,74,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(201,164,74,.04) 1px,transparent 1px);background-size:44px 44px;}
.al-card{width:100%;max-width:380px;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;position:relative;z-index:1;}
.al-head{background:linear-gradient(145deg,var(--navy-d),var(--navy-l));padding:26px 22px 24px;text-align:center;}
.al-logo{display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.al-logo svg{height:44px;width:auto;color:var(--gold);}
.al-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;background:rgba(201,164,74,.15);border:1px solid rgba(201,164,74,.3);border-radius:20px;font-size:11px;color:var(--gold-l);letter-spacing:1px;}
.al-body{padding:24px 22px 20px;}
.al-lbl{display:block;font-size:12px;font-weight:700;color:var(--g600);margin-bottom:5px;letter-spacing:.5px;}
.al-input{width:100%;padding:10px 13px;border:1.5px solid var(--g200);border-radius:8px;font-size:14px;color:var(--g800);background:var(--g50);outline:none;transition:all .2s;font-family:inherit;margin-bottom:14px;}
.al-input:focus{border-color:var(--navy);background:#fff;box-shadow:0 0 0 3px rgba(27,47,110,.08);}
.al-btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--navy-d),var(--navy-l));color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:1px;position:relative;overflow:hidden;}
.al-btn::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2.5px;background:linear-gradient(90deg,var(--gold),var(--gold-l));}
.al-btn:hover{opacity:.93;}
.al-err{margin-top:10px;padding:8px 12px;background:#FEF2F2;border:1px solid #FCA5A5;border-radius:7px;color:#DC2626;font-size:12px;display:none;}
.al-hint{text-align:center;padding:10px 20px 16px;font-size:10.5px;color:var(--g400);border-top:1px solid var(--g100);line-height:1.5;}

/* ── DASHBOARD ── */
#dashboard{display:none;min-height:100vh;}

/* Topbar */
.topbar{background:linear-gradient(135deg,var(--navy-d),var(--navy-l));padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.25);position:sticky;top:0;z-index:100;}
.tb-brand{display:flex;align-items:center;}
.tb-brand svg{height:30px;width:auto;color:var(--gold);}
.tb-badge{padding:3px 10px;background:rgba(201,164,74,.15);border:1px solid rgba(201,164,74,.3);border-radius:12px;font-size:11px;color:var(--gold-l);font-weight:600;}
.tb-right{display:flex;align-items:center;gap:10px;}
.tb-user{font-size:12px;color:rgba(255,255,255,.6);}
.btn-logout{padding:6px 14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:6px;color:rgba(255,255,255,.8);font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s;}
.btn-logout:hover{background:rgba(255,255,255,.15);}
.gold-stripe{height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-l),var(--gold));flex-shrink:0;}

/* Main content */
.main{max-width:1100px;margin:0 auto;padding:28px 20px 48px;}

/* Section titles */
.section-ttl{font-size:13px;font-weight:800;color:var(--g600);letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.section-ttl::before{content:'';display:block;width:3px;height:14px;background:linear-gradient(to bottom,var(--gold),var(--gold-l));border-radius:2px;}

/* Stat cards */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:32px;}
.stat-card{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.04);position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.stat-card.blue::before{background:linear-gradient(90deg,var(--navy),var(--navy-l));}
.stat-card.gold::before{background:linear-gradient(90deg,var(--gold),var(--gold-l));}
.stat-card.green::before{background:linear-gradient(90deg,#10B981,#34D399);}
.stat-card.orange::before{background:linear-gradient(90deg,#F59E0B,#FCD34D);}
.stat-ico{font-size:24px;margin-bottom:8px;display:block;}
.stat-val{font-size:28px;font-weight:800;color:var(--navy);line-height:1;margin-bottom:4px;}
.stat-lbl{font-size:12px;color:var(--g500);font-weight:500;}
.stat-sub{font-size:10.5px;color:var(--g400);margin-top:3px;}

/* Charts */
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:32px;}
.chart-card{background:#fff;border-radius:12px;padding:20px 20px 18px;box-shadow:0 1px 4px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.04);}
.chart-ttl{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:4px;line-height:1.3;}
.chart-meta{font-size:11px;color:var(--g400);margin-bottom:16px;}
.bar-row{margin-bottom:12px;}
.bar-lbl-row{display:flex;justify-content:space-between;margin-bottom:5px;}
.bar-lbl{font-size:12.5px;color:var(--g800);flex:1;padding-right:8px;line-height:1.3;}
.bar-pct{font-size:12px;font-weight:700;color:var(--navy);min-width:36px;text-align:right;}
.bar-track{height:8px;background:var(--g100);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--navy),var(--navy-l));transition:width .6s ease;}
.bar-fill.gold{background:linear-gradient(90deg,var(--gold),var(--gold-l));}
.bar-fill.green{background:linear-gradient(90deg,#10B981,#34D399);}
.bar-count{font-size:10.5px;color:var(--g400);margin-top:2px;}
.no-data{text-align:center;padding:20px;color:var(--g400);font-size:13px;}

/* Respondents table */
.table-card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.04);overflow:hidden;margin-bottom:32px;}
.table-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--g100);}
.table-title{font-size:14px;font-weight:700;color:var(--navy);}
.btn-export{padding:7px 14px;background:linear-gradient(135deg,var(--navy),var(--navy-l));color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;position:relative;overflow:hidden;}
.btn-export::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-l));}
.btn-export:hover{opacity:.9;}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:max-content;min-width:100%;border-collapse:collapse;font-size:13px;}
thead tr{background:var(--navy-pale);}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--navy);letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;min-width:80px;}
th:nth-child(1){min-width:40px;}
th:nth-child(2){min-width:120px;}
th:nth-child(5),th:nth-child(7){min-width:180px;}
td{padding:10px 14px;border-bottom:1px solid var(--g100);color:var(--g800);vertical-align:middle;white-space:nowrap;}
td:nth-child(5),td:nth-child(7){white-space:normal;min-width:180px;max-width:220px;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--g50);}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap;}
.badge-done{background:#D1FAE5;color:#065F46;}
.badge-prog{background:#FEF3C7;color:#92400E;}
.badge-idle{background:var(--g100);color:var(--g600);}
.ans-chip{display:inline-block;padding:2px 8px;background:var(--navy-pale);color:var(--navy);border-radius:10px;font-size:11px;margin:2px 2px 2px 0;white-space:nowrap;}

/* Actions bar */
.actions-bar{display:flex;align-items:center;gap:10px;margin-bottom:24px;flex-wrap:wrap;}
.btn-demo{padding:8px 16px;background:linear-gradient(135deg,#F59E0B,#FCD34D);color:#7C4000;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.btn-demo:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(245,158,11,.3);}
.btn-refresh{padding:8px 16px;background:var(--g100);color:var(--g600);border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;}
.btn-refresh:hover{background:var(--g200);}
.btn-reset{padding:8px 16px;background:#FEF2F2;color:#DC2626;border:1px solid #FECACA;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;}
.btn-reset:hover{background:#FEE2E2;}
.info-txt{font-size:11.5px;color:var(--g400);margin-left:auto;}

.last-refresh{font-size:11px;color:var(--g400);text-align:right;margin-top:-20px;margin-bottom:16px;}

/* Empty state */
.empty-state{text-align:center;padding:50px 20px;}
.empty-ico{font-size:48px;margin-bottom:16px;}
.empty-msg{font-size:15px;color:var(--g600);margin-bottom:6px;}
.empty-sub{font-size:13px;color:var(--g400);}

/* Footer */
.dash-foot{text-align:center;padding:16px;font-size:11px;color:var(--g400);border-top:1px solid var(--g200);}

@media(max-width:640px){
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .charts-grid{grid-template-columns:1fr;}
  .main{padding:20px 14px 40px;}
  .topbar{padding:0 16px;}
  th,td{padding:9px 10px;font-size:12px;}
}
</style>
</head>

    <div class="section-ttl">各題回答分析</div>
    <div class="charts-grid" id="chartsGrid"></div>

    <!-- Table -->
    <div class="section-ttl">受訪者明細</div>
    <div class="table-card">
      <div class="table-header">
        <div class="table-title">回答記錄</div>
        <button class="btn-export" onclick="exportCSV()">⬇ 匯出 CSV</button>
      </div>
      <div class="tbl-wrap">
        <table id="respTable">
          <thead>
            <tr>
              <th>#</th>
              <th>帳號</th>
              <th>進度</th>
              <th>狀態</th>
              <th>第1題</th>
              <th>第2題</th>
              <th>第3題</th>
              <th>第4題</th>
              <th>第5題</th>
              <th>完成時間</th>
            </tr>
          </thead>
          <tbody id="respBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="dash-foot">© 2026 犇亞證券投資股份有限公司 PRIMASIA Securities ｜ 後台管理系統</div>
</div>

<script>
const STORE_KEY = 'primasia_inv_survey';
const ADMIN_CREDS = { admin: 'primasia2026' };

const QUESTIONS = [
  {id:1,type:'multi',q:'您目前投資的理財商品有哪些？',
   opts:['台股、美股','海內外基金 / ETF','債券 / 結構型商品','其他（期貨、加密貨幣等）']},
  {id:2,type:'single',q:'您每月可支配投資金額約為？',
   opts:['新台幣 50 萬元以下','新台幣 51 萬元以上']},
  {id:3,type:'multi',q:'您希望犇亞新增哪些服務功能？',
   opts:['海外股票 / 基金投資','當沖 / 借券 / 智慧單交易','AI 智能投資組合建議','定期投資報告 / 風險提醒']},
  {id:4,type:'single',q:'您是否有意願參加投資理財講座？',
   opts:['有興趣，願意參加','目前沒有意願']},
  {id:5,type:'single',q:'您偏好講座舉辦的時段是？',
   opts:['平日','假日']}
];

// ── AUTH ──
function adminLogin(){
  const id=document.getElementById('adminId').value.trim();
  const pw=document.getElementById('adminPw').value;
  const err=document.getElementById('adminErr');
  if(!ADMIN_CREDS[id]||ADMIN_CREDS[id]!==pw){err.style.display='block';return;}
  err.style.display='none';
  document.getElementById('tbUser').textContent=id;
  document.getElementById('adminLogin').style.display='none';
  document.getElementById('dashboard').style.display='block';
  renderDashboard();
}
document.getElementById('adminPw').addEventListener('keydown',e=>{if(e.key==='Enter')adminLogin();});
function adminLogout(){
  document.getElementById('adminLogin').style.display='flex';
  document.getElementById('dashboard').style.display='none';
  document.getElementById('adminId').value='';
  document.getElementById('adminPw').value='';
}

// ── DATA ──
function loadData(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||{users:{}};}catch(e){return{users:{}};}}

// ── DEMO DATA ──
function genDemoData(){
  const demoUsers = {
    'A100000001':{progress:5,answers:{0:['台股、美股','海內外基金 / ETF'],1:'新台幣 50 萬元以下',2:['AI 智能投資組合建議','定期投資報告 / 風險提醒'],3:'有興趣，願意參加',4:'平日'},dismissedUntil:null,completedAt:'2026-05-20T09:15:00Z',loginCount:5,firstLogin:'2026-05-16T10:00:00Z'},
    'B200000002':{progress:5,answers:{0:['台股、美股'],1:'新台幣 51 萬元以上',2:['海外股票 / 基金投資','當沖 / 借券 / 智慧單交易'],3:'有興趣，願意參加',4:'假日'},dismissedUntil:null,completedAt:'2026-05-22T14:30:00Z',loginCount:6,firstLogin:'2026-05-17T08:30:00Z'},
    'C300000003':{progress:3,answers:{0:['債券 / 結構型商品','其他（期貨、加密貨幣等）'],1:'新台幣 50 萬元以下',2:['AI 智能投資組合建議']},dismissedUntil:null,completedAt:null,loginCount:3,firstLogin:'2026-05-18T11:00:00Z'},
    'D400000004':{progress:5,answers:{0:['台股、美股','海內外基金 / ETF','債券 / 結構型商品'],1:'新台幣 50 萬元以下',2:['海外股票 / 基金投資','定期投資報告 / 風險提醒'],3:'目前沒有意願',4:'平日'},dismissedUntil:null,completedAt:'2026-05-23T16:00:00Z',loginCount:5,firstLogin:'2026-05-19T13:00:00Z'},
    'E500000005':{progress:2,answers:{0:['台股、美股'],1:'新台幣 51 萬元以上'},dismissedUntil:null,completedAt:null,loginCount:2,firstLogin:'2026-05-21T09:00:00Z'},
    'F600000006':{progress:5,answers:{0:['海內外基金 / ETF'],1:'新台幣 50 萬元以下',2:['AI 智能投資組合建議','當沖 / 借券 / 智慧單交易'],3:'有興趣，願意參加',4:'假日'},dismissedUntil:null,completedAt:'2026-05-24T11:20:00Z',loginCount:5,firstLogin:'2026-05-20T10:00:00Z'},
    'G700000007':{progress:1,answers:{0:['其他（期貨、加密貨幣等）']},dismissedUntil:null,completedAt:null,loginCount:1,firstLogin:'2026-05-25T14:00:00Z'},
    'H800000008':{progress:5,answers:{0:['台股、美股','其他（期貨、加密貨幣等）'],1:'新台幣 51 萬元以上',2:['海外股票 / 基金投資','AI 智能投資組合建議'],3:'有興趣，願意參加',4:'平日'},dismissedUntil:null,completedAt:'2026-05-25T17:45:00Z',loginCount:5,firstLogin:'2026-05-21T09:00:00Z'},
    'Y123123113':{progress:0,answers:{},dismissedUntil:null,completedAt:null,loginCount:1,firstLogin:'2026-05-26T10:00:00Z'},
  };
  const cur=loadData();
  Object.assign(cur.users,demoUsers);
  localStorage.setItem(STORE_KEY,JSON.stringify(cur));
  renderDashboard();
}

// ── RENDER ──
function renderDashboard(){
  const d=loadData();
  const users=Object.entries(d.users);
  const total=users.length;
  const started=users.filter(([,u])=>u.progress>0).length;
  const completed=users.filter(([,u])=>u.progress>=5).length;
  const inprog=started-completed;
  const compRate=started>0?Math.round(completed/started*100):0;

  // Stats
  document.getElementById('statsGrid').innerHTML=`
    <div class="stat-card blue"><span class="stat-ico">👥</span><div class="stat-val">${total}</div><div class="stat-lbl">總登入人數</div></div>
    <div class="stat-card gold"><span class="stat-ico">📝</span><div class="stat-val">${started}</div><div class="stat-lbl">已開始填答</div></div>
    <div class="stat-card green"><span class="stat-ico">✅</span><div class="stat-val">${completed}</div><div class="stat-lbl">已完成問卷</div><div class="stat-sub">完成率 ${compRate}%</div></div>
    <div class="stat-card orange"><span class="stat-ico">⏳</span><div class="stat-val">${inprog}</div><div class="stat-lbl">進行中</div></div>`;

  // Charts - aggregate answers
  const responders = users.filter(([,u])=>u.progress>0);
  const charts = QUESTIONS.map((q,qi)=>{
    const answered=responders.filter(([,u])=>u.answers&&u.answers[qi]!==undefined);
    const n=answered.length;
    const counts={};
    q.opts.forEach(o=>counts[o]=0);
    answered.forEach(([,u])=>{
      const a=u.answers[qi];
      if(Array.isArray(a))a.forEach(v=>{if(counts[v]!==undefined)counts[v]++;});
      else if(counts[a]!==undefined)counts[a]++;
    });
    const maxVal=Math.max(...Object.values(counts),1);
    const colors=['','gold','green','','gold',''];
    const barsHtml=q.opts.map((o,i)=>{
      const c=counts[o]||0;
      const pct=n>0?Math.round(c/n*100):0;
      const w=n>0?Math.round(c/maxVal*100):0;
      const cl=i%2===1?'gold':'';
      return `<div class="bar-row">
        <div class="bar-lbl-row"><span class="bar-lbl">${o}</span><span class="bar-pct">${pct}%</span></div>
        <div class="bar-track"><div class="bar-fill ${cl}" style="width:${w}%"></div></div>
        <div class="bar-count">${c} 人回答</div>
      </div>`;
    }).join('');
    return `<div class="chart-card">
      <div class="chart-ttl">${qi+1}. ${q.q}</div>
      <div class="chart-meta">${q.type==='multi'?'可複選 ｜ ':''}已回答 ${n} 人</div>
      ${n>0?barsHtml:'<div class="no-data">尚無回答資料</div>'}
    </div>`;
  }).join('');
  document.getElementById('chartsGrid').innerHTML=charts||'<div class="no-data">尚無資料</div>';

  // Table
  if(users.length===0){
    document.getElementById('respBody').innerHTML=`<tr><td colspan="10"><div class="empty-state"><div class="empty-ico">📋</div><div class="empty-msg">尚無受訪資料</div><div class="empty-sub">點選「載入示範資料」可預覽效果</div></div></td></tr>`;
  } else {
    document.getElementById('respBody').innerHTML=users.map(([uid,u],i)=>{
      const prog=u.progress||0;
      let badge='';
      if(prog>=5)badge='<span class="badge badge-done">✓ 完成</span>';
      else if(prog>0)badge=`<span class="badge badge-prog">進行中 ${prog}/5</span>`;
      else badge='<span class="badge badge-idle">未開始</span>';
      const ans=u.answers||{};
      const fmtAns=(a)=>{
        if(a===undefined)return '<span style="color:var(--g400)">—</span>';
        if(Array.isArray(a))return a.map(v=>`<span class="ans-chip">${v}</span>`).join('');
        return `<span class="ans-chip">${a}</span>`;
      };
      const ct=u.completedAt?new Date(u.completedAt).toLocaleDateString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
      return `<tr>
        <td>${i+1}</td>
        <td><strong>${uid}</strong></td>
        <td><div style="background:var(--g100);border-radius:4px;height:6px;width:80px;overflow:hidden;margin-bottom:3px;"><div style="height:100%;width:${prog/5*100}%;background:linear-gradient(90deg,var(--navy),var(--navy-l));border-radius:4px;"></div></div>${prog}/5</td>
        <td>${badge}</td>
        <td>${fmtAns(ans[0])}</td>
        <td>${fmtAns(ans[1])}</td>
        <td>${fmtAns(ans[2])}</td>
        <td>${fmtAns(ans[3])}</td>
        <td>${fmtAns(ans[4])}</td>
        <td style="white-space:nowrap;font-size:12px;color:var(--g500)">${ct}</td>
      </tr>`;
    }).join('');
  }

  const now=new Date();
  document.getElementById('refreshTime').textContent=`最後更新：${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
}

// ── EXPORT CSV ──
function exportCSV(){
  const d=loadData();
  const users=Object.entries(d.users);
  const headers=['帳號','進度','狀態','第1題-投資商品','第2題-投資金額','第3題-希望服務','第4題-講座意願','第5題-時段偏好','完成時間'];
  const rows=users.map(([uid,u])=>{
    const ans=u.answers||{};
    const fmtAns=(a)=>{
      if(a===undefined)return '';
      return Array.isArray(a)?a.join('|'):a;
    };
    const status=u.progress>=5?'完成':u.progress>0?`進行中(${u.progress}/5)`:'未開始';
    const ct=u.completedAt?new Date(u.completedAt).toLocaleString('zh-TW'):'';
    return [uid,u.progress,status,fmtAns(ans[0]),fmtAns(ans[1]),fmtAns(ans[2]),fmtAns(ans[3]),fmtAns(ans[4]),ct].map(v=>`"${v}"`).join(',');
  });
  const bom='﻿';
  const csv=bom+[headers.join(','),...rows].join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download=`犇亞證券_投資調查_${new Date().toLocaleDateString('zh-TW').replace(/\//g,'')}.csv`;
  a.click();
}

// ── RESET ──
function confirmReset(){
  if(confirm('確定要清除所有問卷資料嗎？\n此操作無法還原。')){
    localStorage.removeItem(STORE_KEY);
    renderDashboard();
  }
}

// Auto-refresh every 30s when dashboard is visible
setInterval(()=>{
  if(document.getElementById('dashboard').style.display==='block')renderDashboard();
},30000);
</script>
