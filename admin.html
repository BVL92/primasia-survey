<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>犇亞證券 | 投資調查後台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --navy:#1B2F6E;--navy-d:#0D1B3E;--navy-l:#2D4A8E;--navy-pale:#EEF2FF;
  --gold:#C9A44A;--gold-l:#E8C96A;--gold-pale:#FDF6E3;
  --white:#fff;--g50:#F8FAFC;--g100:#F1F5F9;--g200:#E2E8F0;
  --g400:#94A3B8;--g500:#64748B;--g600:#475569;--g800:#1E293B;
  --green:#10B981;--red:#EF4444;--orange:#F59E0B;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif;background:var(--g50);color:var(--g800);}

/* ── ADMIN LOGIN ── */
#adminLogin{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(150deg,var(--navy-d),var(--navy),var(--navy-d));padding:20px;}
#adminLogin::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(201,164,74,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(201,164,74,.04) 1px,transparent 1px);background-size:44px 44px;}
.al-card{width:100%;max-width:380px;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;position:relative;z-index:1;}
.al-head{background:linear-gradient(145deg,var(--navy-d),var(--navy-l));padding:26px 22px 24px;text-align:center;}
.al-logo{display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.al-logo svg{height:44px;width:auto;color:var(--gold);}
.al-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;background:rgba(201,164,74,.15);border:1px solid rgba(201,164,74,.3);border-radius:20px;font-size:11px;color:var(--gold-l);letter-spacing:1px;}
.al-body{padding:24px 22px 20px;}
.al-lbl{display:block;font-size:12px;font-weight:700;color:var(--g600);margin-bottom:5px;letter-spacing:.5px;}
.al-input{width:100%;padding:10px 13px;border:1.5px solid var(--g200);border-radius:8px;font-size:14px;color:var(--g800);background:var(--g50);outline:none;transition:all .2s;font-family:inherit;margin-bottom:14px;}
.al-input:focus{border-color:var(--navy);background:#fff;box-shadow:0 0 0 3px rgba(27,47,110,.08);}
.al-btn{width:100%;padding:12px;background:linear-gradient(135deg,var(--navy-d),var(--navy-l));color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:1px;position:relative;overflow:hidden;}
.al-btn::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2.5px;background:linear-gradient(90deg,var(--gold),var(--gold-l));}
.al-btn:hover{opacity:.93;}
.al-err{margin-top:10px;padding:8px 12px;background:#FEF2F2;border:1px solid #FCA5A5;border-radius:7px;color:#DC2626;font-size:12px;display:none;}
.al-hint{text-align:center;padding:10px 20px 16px;font-size:10.5px;color:var(--g400);border-top:1px solid var(--g100);line-height:1.5;}

/* ── DASHBOARD ── */
#dashboard{display:none;min-height:100vh;}
.topbar{background:linear-gradient(135deg,var(--navy-d),var(--navy-l));padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.25);position:sticky;top:0;z-index:100;}
.tb-brand{display:flex;align-items:center;gap:10px;}
.tb-brand svg{height:30px;width:auto;color:var(--gold);}
.tb-badge{padding:3px 10px;background:rgba(201,164,74,.15);border:1px solid rgba(201,164,74,.3);border-radius:12px;font-size:11px;color:var(--gold-l);font-weight:600;}
.tb-right{display:flex;align-items:center;gap:10px;}
.tb-user{font-size:12px;color:rgba(255,255,255,.6);}
.btn-logout{padding:6px 14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:6px;color:rgba(255,255,255,.8);font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s;}
.btn-logout:hover{background:rgba(255,255,255,.15);}
.gold-stripe{height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-l),var(--gold));flex-shrink:0;}

/* ── TABS ── */
.tab-nav{background:#fff;border-bottom:2px solid var(--g200);padding:0 24px;display:flex;position:sticky;top:60px;z-index:99;}
.tab-btn{padding:15px 22px;background:none;border:none;font-size:13px;font-weight:600;color:var(--g500);cursor:pointer;font-family:inherit;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s;white-space:nowrap;}
.tab-btn.active{color:var(--navy);border-bottom-color:var(--navy);}
.tab-btn:hover:not(.active){color:var(--g800);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ── MAIN LAYOUT ── */
.main{max-width:1100px;margin:0 auto;padding:28px 20px 48px;}
.section-ttl{font-size:13px;font-weight:800;color:var(--g600);letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.section-ttl::before{content:'';display:block;width:3px;height:14px;background:linear-gradient(to bottom,var(--gold),var(--gold-l));border-radius:2px;}

/* ── STAT CARDS ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:32px;}
.stat-card{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.04);position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.stat-card.blue::before{background:linear-gradient(90deg,var(--navy),var(--navy-l));}
.stat-card.gold::before{background:linear-gradient(90deg,var(--gold),var(--gold-l));}
.stat-card.green::before{background:linear-gradient(90deg,#10B981,#34D399);}
.stat-card.orange::before{background:linear-gradient(90deg,#F59E0B,#FCD34D);}
.stat-ico{font-size:24px;margin-bottom:8px;display:block;}
.stat-val{font-size:28px;font-weight:800;color:var(--navy);line-height:1;margin-bottom:4px;}
.stat-lbl{font-size:12px;color:var(--g500);font-weight:500;}
.stat-sub{font-size:10.5px;color:var(--g400);margin-top:3px;}

/* ── CHARTS ── */
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:32px;}
.chart-card{background:#fff;border-radius:12px;padding:20px 20px 18px;box-shadow:0 1px 4px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.04);}
.chart-ttl{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:4px;line-height:1.3;}
.chart-meta{font-size:11px;color:var(--g400);margin-bottom:16px;}
.bar-row{margin-bottom:12px;}
.bar-lbl-row{display:flex;justify-content:space-between;margin-bottom:5px;}
.bar-lbl{font-size:12.5px;color:var(--g800);flex:1;padding-right:8px;line-height:1.3;}
.bar-pct{font-size:12px;font-weight:700;color:var(--navy);min-width:36px;text-align:right;}
.bar-track{height:8px;background:var(--g100);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--navy),var(--navy-l));transition:width .6s ease;}
.bar-fill.gold{background:linear-gradient(90deg,var(--gold),var(--gold-l));}
.bar-fill.green{background:linear-gradient(90deg,#10B981,#34D399);}
.bar-count{font-size:10.5px;color:var(--g400);margin-top:2px;}
.no-data{text-align:center;padding:20px;color:var(--g400);font-size:13px;}

/* ── RESPONDENTS TABLE ── */
.table-card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.04);overflow:hidden;margin-bottom:32px;}
.table-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--g100);}
.table-title{font-size:14px;font-weight:700;color:var(--navy);}
.btn-export{padding:7px 14px;background:linear-gradient(135deg,var(--navy),var(--navy-l));color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;position:relative;overflow:hidden;}
.btn-export::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-l));}
.btn-export:hover{opacity:.9;}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:max-content;min-width:100%;border-collapse:collapse;font-size:13px;}
thead tr{background:var(--navy-pale);}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--navy);letter-spacing:.8px;white-space:nowrap;}
td{padding:10px 14px;border-bottom:1px solid var(--g100);color:var(--g800);vertical-align:middle;white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--g50);}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap;}
.badge-done{background:#D1FAE5;color:#065F46;}
.badge-prog{background:#FEF3C7;color:#92400E;}
.badge-idle{background:var(--g100);color:var(--g600);}
.badge-active{background:#D1FAE5;color:#065F46;}
.badge-ended{background:var(--g100);color:var(--g600);}
.badge-draft{background:#FEF3C7;color:#92400E;}
.ans-chip{display:inline-block;padding:2px 8px;background:var(--navy-pale);color:var(--navy);border-radius:10px;font-size:11px;margin:2px 2px 2px 0;white-space:normal;word-break:keep-all;}

/* ── ACTIONS BAR ── */
.actions-bar{display:flex;align-items:center;gap:10px;margin-bottom:24px;flex-wrap:wrap;}
.btn-primary{padding:8px 18px;background:linear-gradient(135deg,var(--navy-d),var(--navy-l));color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;position:relative;overflow:hidden;transition:opacity .2s;}
.btn-primary::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-l));}
.btn-primary:hover{opacity:.9;}
.btn-demo{padding:8px 16px;background:linear-gradient(135deg,#F59E0B,#FCD34D);color:#7C4000;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.btn-demo:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(245,158,11,.3);}
.btn-ghost{padding:8px 16px;background:var(--g100);color:var(--g600);border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;}
.btn-ghost:hover{background:var(--g200);}
.btn-danger{padding:8px 16px;background:#FEF2F2;color:#DC2626;border:1px solid #FECACA;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;}
.btn-danger:hover{background:#FEE2E2;}
.info-txt{font-size:11.5px;color:var(--g400);margin-left:auto;}

/* ── PROJECT SELECTOR ── */
.proj-selector{display:flex;align-items:center;gap:10px;margin-bottom:24px;padding:14px 18px;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.04);flex-wrap:wrap;}
.proj-selector label{font-size:12px;font-weight:700;color:var(--g600);white-space:nowrap;}
.proj-select{flex:1;min-width:200px;max-width:380px;padding:7px 12px;border:1.5px solid var(--g200);border-radius:7px;font-size:13px;font-family:inherit;color:var(--g800);background:var(--g50);cursor:pointer;outline:none;}
.proj-select:focus{border-color:var(--navy);}
.proj-active-badge{padding:4px 12px;background:#D1FAE5;color:#065F46;border-radius:20px;font-size:11px;font-weight:700;display:none;}

/* ── INCOMPLETE ANALYSIS ── */
.incomplete-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.04);margin-bottom:32px;overflow:hidden;}
.incomplete-ttl{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:4px;}
.incomplete-sub{font-size:11px;color:var(--g400);margin-bottom:16px;line-height:1.5;}
.ic-table{width:100%;border-collapse:collapse;font-size:13px;}
.ic-table th{padding:9px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--navy);background:var(--navy-pale);letter-spacing:.5px;white-space:nowrap;}
.ic-table td{padding:10px 14px;border-bottom:1px solid var(--g100);vertical-align:middle;}
.ic-table tr:last-child td{border-bottom:none;}
.ic-table tr:hover td{background:var(--g50);}
.ic-num{font-size:20px;font-weight:800;color:var(--red);line-height:1;}
.ic-num.zero{color:var(--g400);}
.ic-bar-wrap{display:flex;align-items:center;gap:8px;}
.ic-bar{height:7px;background:var(--g100);border-radius:4px;flex:1;overflow:hidden;}
.ic-fill{height:100%;background:linear-gradient(90deg,var(--red),#FCA5A5);border-radius:4px;transition:width .6s ease;}
.ic-pct{font-size:11px;color:var(--g500);min-width:32px;text-align:right;}

/* ── PROJECT CARDS ── */
.proj-list{display:flex;flex-direction:column;gap:12px;margin-bottom:32px;}
.proj-card{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 1px 4px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.04);display:flex;align-items:center;gap:16px;flex-wrap:wrap;transition:box-shadow .2s;}
.proj-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1),0 0 0 1px rgba(0,0,0,.04);}
.proj-card-left{flex:1;min-width:200px;}
.proj-name{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.proj-period{font-size:12px;color:var(--g500);margin-bottom:3px;}
.proj-mode{font-size:11px;color:var(--g400);}
.proj-card-mid{display:flex;gap:24px;flex-wrap:wrap;}
.proj-stat{text-align:center;min-width:48px;}
.proj-stat-val{font-size:22px;font-weight:800;color:var(--navy);line-height:1;}
.proj-stat-lbl{font-size:10px;color:var(--g400);margin-top:2px;}
.proj-card-right{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.btn-sm{padding:6px 12px;border:none;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;white-space:nowrap;}
.btn-sm.navy{background:var(--navy);color:#fff;}
.btn-sm.navy:hover{opacity:.88;}
.btn-sm.ghost{background:var(--g100);color:var(--g600);}
.btn-sm.ghost:hover{background:var(--g200);}
.btn-sm.danger{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA;}
.btn-sm.danger:hover{background:#FEE2E2;}
.btn-sm.gold{background:linear-gradient(135deg,var(--gold),var(--gold-l));color:#4A3500;}
.btn-sm.gold:hover{opacity:.9;}

/* ── PROJECT FORM ── */
.proj-form-wrap{background:#fff;border-radius:12px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.06);margin-bottom:24px;display:none;border-top:3px solid var(--navy);}
.proj-form-wrap.open{display:block;}
.form-row{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
.form-group{flex:1;min-width:150px;}
.form-label{display:block;font-size:12px;font-weight:700;color:var(--g600);margin-bottom:5px;letter-spacing:.3px;}
.form-input{width:100%;padding:9px 12px;border:1.5px solid var(--g200);border-radius:8px;font-size:13px;font-family:inherit;color:var(--g800);background:var(--g50);outline:none;transition:border-color .2s;}
.form-input:focus{border-color:var(--navy);background:#fff;}
.radio-group{display:flex;gap:20px;flex-wrap:wrap;padding-top:3px;}
.radio-opt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--g800);cursor:pointer;}
.radio-opt input{accent-color:var(--navy);width:15px;height:15px;}

/* question editor */
.q-editor{border:1.5px solid var(--g200);border-radius:10px;overflow:hidden;margin-bottom:16px;}
.q-editor-head{padding:11px 16px;background:var(--g50);border-bottom:1px solid var(--g200);display:flex;align-items:center;gap:8px;}
.q-editor-title{font-size:13px;font-weight:700;color:var(--navy);flex:1;}
.q-list{padding:12px;}
.q-item{border:1px solid var(--g200);border-radius:8px;padding:12px;margin-bottom:10px;background:#fff;}
.q-item:last-child{margin-bottom:0;}
.q-item-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.q-num{font-size:11px;font-weight:700;color:var(--g400);white-space:nowrap;}
.q-type-sel{padding:4px 8px;border:1px solid var(--g200);border-radius:6px;font-size:12px;font-family:inherit;color:var(--g600);background:var(--g50);cursor:pointer;}
.btn-del-q{margin-left:auto;padding:3px 10px;background:#FEF2F2;color:#DC2626;border:1px solid #FECACA;border-radius:5px;font-size:11px;cursor:pointer;font-family:inherit;}
.btn-del-q:hover{background:#FEE2E2;}
.q-text-input{width:100%;padding:7px 10px;border:1px solid var(--g200);border-radius:6px;font-size:13px;font-family:inherit;margin-bottom:8px;outline:none;}
.q-text-input:focus{border-color:var(--navy);}
.opts-list{padding-left:0;}
.opt-item{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.opt-input{flex:1;padding:6px 10px;border:1px solid var(--g200);border-radius:6px;font-size:12px;font-family:inherit;outline:none;}
.opt-input:focus{border-color:var(--navy);}
.btn-del-opt{width:22px;height:22px;border:none;background:var(--g100);border-radius:4px;color:var(--g500);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;}
.btn-del-opt:hover{background:#FEE2E2;color:#DC2626;}
.btn-add-opt{padding:4px 10px;background:var(--g50);border:1px dashed var(--g400);border-radius:5px;font-size:11px;color:var(--g600);cursor:pointer;font-family:inherit;margin-top:2px;}
.btn-add-opt:hover{background:var(--g100);}
.btn-add-q{padding:9px 16px;background:var(--g50);border:1px dashed var(--g400);border-radius:8px;font-size:13px;color:var(--g600);cursor:pointer;font-family:inherit;width:100%;margin-top:4px;}
.btn-add-q:hover{background:var(--g100);}

/* upload area */
.upload-area{border:2px dashed var(--g200);border-radius:10px;padding:18px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:12px;}
.upload-area:hover{border-color:var(--navy);background:var(--navy-pale);}
.upload-icon{font-size:26px;margin-bottom:4px;}
.upload-txt{font-size:13px;color:var(--g600);margin-bottom:3px;font-weight:600;}
.upload-sub{font-size:11px;color:var(--g400);line-height:1.5;}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--g200);}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:50px 20px;}
.empty-ico{font-size:48px;margin-bottom:16px;}
.empty-msg{font-size:15px;color:var(--g600);margin-bottom:6px;font-weight:600;}
.empty-sub{font-size:13px;color:var(--g400);}
.dash-foot{text-align:center;padding:16px;font-size:11px;color:var(--g400);border-top:1px solid var(--g200);}

@media(max-width:640px){
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .charts-grid{grid-template-columns:1fr;}
  .main{padding:20px 14px 40px;}
  .topbar{padding:0 16px;}
  th,td{padding:8px 10px;font-size:12px;}
  .tab-btn{padding:12px 14px;font-size:12px;}
  .proj-card{flex-direction:column;align-items:flex-start;}
  .form-row{flex-direction:column;}
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- ── ADMIN LOGIN ── -->
<div id="adminLogin">
  <div class="al-card">

// ── TABS ──
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id===`tab_${name}`));

// ── PROJECTS FIRESTORE ──
async function loadProjects(){
  try{
    const snap=await db.collection('projects').orderBy('createdAt','desc').get();
    allProjects={};
    snap.forEach(doc=>{allProjects[doc.id]={id:doc.id,...doc.data()};});
  }catch(e){console.warn('載入專案失敗:',e);}
  return allProjects;
}

async function loadProjectResponses(projectId){
  const p=allProjects[projectId];
  try{
    const snap=p?.isLegacy
      ?await db.collection('surveys').get()
      :await db.collection('projects').doc(projectId).collection('responses').get();
    const users={};
    snap.forEach(doc=>{users[doc.id]=doc.data();});
    return{users};
  }catch(e){return{users:{}};}
}

async function loadLegacyData(){
  try{
    const snap=await db.collection('surveys').get();
    if(!snap.empty){const users={};snap.forEach(doc=>{users[doc.id]=doc.data();});return{users};}
  }catch(e){}
  try{return JSON.parse(localStorage.getItem(STORE_KEY))||{users:{}};}catch(e){return{users:{}};}
}

function getCurrentQuestions(){
  if(currentStatsProjectId&&allProjects[currentStatsProjectId]?.questions?.length)
    return allProjects[currentStatsProjectId].questions;
  return LEGACY_QUESTIONS;
}

// ── STATS TAB ──
async function renderDashboard(){
  document.getElementById('refreshTime').textContent='載入中…';
  await loadProjects();
  updateProjectSelector();

  const questions=getCurrentQuestions();
  const data=currentStatsProjectId ? await loadProjectResponses(currentStatsProjectId) : await loadLegacyData();
  const userEntries=Object.entries(data.users);
  const total=userEntries.length;
  const started=userEntries.filter(([,u])=>u.progress>0).length;
  const completed=userEntries.filter(([,u])=>u.progress>=questions.length).length;
  const inprog=started-completed;
  const notStarted=total-started;
  const compRate=started>0?Math.round(completed/started*100):0;

  document.getElementById('statsGrid').innerHTML=`
    <div class="stat-card blue"><span class="stat-ico">👥</span><div class="stat-val">${total}</div><div class="stat-lbl">總登入人數</div></div>
    <div class="stat-card gold"><span class="stat-ico">📝</span><div class="stat-val">${started}</div><div class="stat-lbl">已開始填答</div></div>
    <div class="stat-card green"><span class="stat-ico">✅</span><div class="stat-val">${completed}</div><div class="stat-lbl">已完成問卷</div><div class="stat-sub">完成率 ${compRate}%</div></div>
    <div class="stat-card orange"><span class="stat-ico">⏳</span><div class="stat-val">${inprog+notStarted}</div><div class="stat-lbl">未完成</div><div class="stat-sub">進行中 ${inprog}｜未作答 ${notStarted}</div></div>`;

  renderIncompleteAnalysis(data.users,questions);
  renderCharts(data.users,questions);
  renderTable(userEntries,questions);

  const now=new Date();
  document.getElementById('refreshTime').textContent=`最後更新：${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
}

// ── INCOMPLETE ANALYSIS ──
function renderIncompleteAnalysis(users,questions){
  const container=document.getElementById('incompleteSection');
  const userList=Object.values(users);
  const total=userList.length;
  if(total===0){
    container.innerHTML='<div class="incomplete-card"><div class="no-data">尚無資料</div></div>';
    return;
  }
  // dropoffs[i] = users whose progress === i (stuck at question i, meaning they haven't answered question i yet)
  const dropoffs=Array(questions.length).fill(0);
  userList.forEach(u=>{
    const prog=u.progress||0;
    if(prog<questions.length && prog<dropoffs.length) dropoffs[prog]++;
  });
  const maxVal=Math.max(...dropoffs,1);
  const rows=questions.map((q,i)=>{
    const count=dropoffs[i]||0;
    const pct=Math.round(count/total*100);
    const barW=Math.round(count/maxVal*100);
    const note=i===0?'登入後未作答即離開':`完成第${i}題後離開（卡在第${i+1}題）`;
    const shortQ=q.q.length>28?q.q.substring(0,28)+'…':q.q;
    return `<tr>
      <td style="white-space:nowrap"><strong>第 ${i+1} 題</strong></td>
      <td style="max-width:200px;white-space:normal;font-size:12px;color:var(--g600)">${shortQ}</td>
      <td style="white-space:nowrap;font-size:11px;color:var(--g400)">${note}</td>
      <td style="white-space:nowrap"><span class="ic-num ${count===0?'zero':''}">${count}</span> 人</td>
      <td style="min-width:120px"><div class="ic-bar-wrap"><div class="ic-bar"><div class="ic-fill" style="width:${barW}%"></div></div><span class="ic-pct">${pct}%</span></div></td>
    </tr>`;
  }).join('');
  container.innerHTML=`<div class="incomplete-card">
    <div class="incomplete-ttl">各題未完成人數</div>
    <div class="incomplete-sub">顯示在各題卡關（尚未作答就離開）的人數。<br>第1題未完成 = 登入問卷系統但未回答任何題目就離開的人數。</div>
    <div style="overflow-x:auto">
    <table class="ic-table">
      <thead><tr><th>題目</th><th>問題摘要</th><th>說明</th><th>未完成人數</th><th>佔全部登入者</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
  </div>`;
}

// ── CHARTS ──
function renderCharts(users,questions){
  const responders=Object.entries(users).filter(([,u])=>u.progress>0);
  const charts=questions.map((q,qi)=>{
    const answered=responders.filter(([,u])=>u.answers&&u.answers[qi]!==undefined);
    const n=answered.length;
    const counts={};q.opts.forEach(o=>counts[o]=0);
    answered.forEach(([,u])=>{
      const a=u.answers[qi];
      if(Array.isArray(a))a.forEach(v=>{if(counts[v]!==undefined)counts[v]++;});
      else if(counts[a]!==undefined)counts[a]++;
    });
    const maxVal=Math.max(...Object.values(counts),1);
    const barsHtml=q.opts.map((o,i)=>{
      const c=counts[o]||0;
      const pct=n>0?Math.round(c/n*100):0;
      const w=n>0?Math.round(c/maxVal*100):0;
      const cl=i%2===1?'gold':i%3===2?'green':'';
      return `<div class="bar-row">
        <div class="bar-lbl-row"><span class="bar-lbl">${o}</span><span class="bar-pct">${pct}%</span></div>
        <div class="bar-track"><div class="bar-fill ${cl}" style="width:${w}%"></div></div>
        <div class="bar-count">${c} 人回答</div>
      </div>`;
    }).join('');
    return `<div class="chart-card">
      <div class="chart-ttl">${qi+1}. ${q.q}</div>
      <div class="chart-meta">${q.type==='multi'?'可複選 ｜ ':''}已回答 ${n} 人</div>
      ${n>0?barsHtml:'<div class="no-data">尚無回答資料</div>'}
    </div>`;
  }).join('');
  document.getElementById('chartsGrid').innerHTML=charts||'<div class="no-data">尚無資料</div>';
}

// ── TABLE ──
function renderTable(userEntries,questions){
  const qHeaders=questions.map((_,i)=>`<th>第${i+1}題</th>`).join('');
  document.getElementById('respHead').innerHTML=`<tr><th>#</th><th>帳號</th><th>進度</th><th>狀態</th>${qHeaders}<th>完成時間</th></tr>`;
  if(userEntries.length===0){
    document.getElementById('respBody').innerHTML=`<tr><td colspan="${4+questions.length+1}"><div class="empty-state"><div class="empty-ico">📋</div><div class="empty-msg">尚無受訪資料</div><div class="empty-sub">點選「載入示範資料」可預覽效果</div></div></td></tr>`;
    return;
  }
  const fmtAns=a=>{
    if(a===undefined)return '<span style="color:var(--g400)">—</span>';
    if(Array.isArray(a))return a.map(v=>`<span class="ans-chip">${v}</span>`).join('');
    return `<span class="ans-chip">${a}</span>`;
  };
  document.getElementById('respBody').innerHTML=userEntries.map(([uid,u],i)=>{
    const prog=u.progress||0;const qLen=questions.length;
    let badge='';
    if(prog>=qLen)badge='<span class="badge badge-done">✓ 完成</span>';
    else if(prog>0)badge=`<span class="badge badge-prog">進行中 ${prog}/${qLen}</span>`;
    else badge='<span class="badge badge-idle">未開始</span>';
    const ans=u.answers||{};
    const answerCells=questions.map((_,qi)=>`<td style="white-space:normal;min-width:120px;max-width:200px">${fmtAns(ans[qi])}</td>`).join('');
    const ct=u.completedAt?new Date(u.completedAt).toLocaleString('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
    const pBar=`<div style="background:var(--g100);border-radius:4px;height:5px;width:72px;overflow:hidden;margin-bottom:2px"><div style="height:100%;width:${Math.min(prog/qLen,1)*100}%;background:linear-gradient(90deg,var(--navy),var(--navy-l));border-radius:4px"></div></div>${prog}/${qLen}`;
    return `<tr><td>${i+1}</td><td><strong>${uid}</strong></td><td style="white-space:nowrap">${pBar}</td><td>${badge}</td>${answerCells}<td style="font-size:12px;color:var(--g500);white-space:nowrap">${ct}</td></tr>`;
  }).join('');
}

// ── EXPORT CSV ──
async function exportCSV(){
  const questions=getCurrentQuestions();
  const data=currentStatsProjectId?await loadProjectResponses(currentStatsProjectId):await loadLegacyData();
  const userEntries=Object.entries(data.users);
  const qHeaders=questions.map((_,i)=>`第${i+1}題`);
  const headers=['帳號','進度','狀態',...qHeaders,'完成時間'];
  const fmtAns=a=>{if(a===undefined)return'';return Array.isArray(a)?a.join('|'):a;};
  const rows=userEntries.map(([uid,u])=>{
    const ans=u.answers||{};const qLen=questions.length;
    const status=u.progress>=qLen?'完成':u.progress>0?`進行中(${u.progress}/${qLen})`:'未開始';
    const ct=u.completedAt?new Date(u.completedAt).toLocaleString('zh-TW'):'';
    const ansCols=questions.map((_,qi)=>fmtAns(ans[qi]));
    return[uid,u.progress,status,...ansCols,ct].map(v=>`"${v}"`).join(',');
  });
  const projName=currentStatsProjectId?allProjects[currentStatsProjectId]?.name||'專案':'舊版資料';
  const bom='﻿';
  const csv=bom+[headers.join(','),...rows].join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download=`犇亞證券_${projName}_${new Date().toLocaleDateString('zh-TW').replace(/\//g,'')}.csv`;
  a.click();
}

// ── RESET ──
async function confirmReset(){
  const projName=currentStatsProjectId?`專案「${allProjects[currentStatsProjectId]?.name}」`:'舊版資料';
  if(!confirm(`確定要清除 ${projName} 的所有問卷資料嗎？\n此操作無法還原。`))return;
  if(currentStatsProjectId){
    try{
      const snap=await db.collection('projects').doc(currentStatsProjectId).collection('responses').get();
      const batch=db.batch();snap.forEach(doc=>batch.delete(doc.ref));await batch.commit();
    }catch(e){console.warn('Firestore 刪除失敗:',e);}
  }else{
    localStorage.removeItem(STORE_KEY);
    try{
      const snap=await db.collection('surveys').get();
      const batch=db.batch();snap.forEach(doc=>batch.delete(doc.ref));await batch.commit();
    }catch(e){console.warn('Firestore 刪除失敗:',e);}
  }
  renderDashboard();
}

// ── PROJECT MANAGEMENT TAB ──
async function renderProjectsTab(){
  const container=document.getElementById('projList');
  await loadProjects();
  const projects=Object.values(allProjects);
  if(projects.length===0){
    container.innerHTML=`<div class="empty-state"><div class="empty-ico">📋</div><div class="empty-msg">尚無問卷專案</div><div class="empty-sub">點選「新增問卷專案」建立第一個問卷</div></div>`;
    return;
  }
  container.innerHTML='<div style="color:var(--g400);font-size:13px;padding:8px 0">載入統計中…</div>';

  const cards=await Promise.all(projects.map(async p=>{
    let total=0,completed=0,inprog=0;
    try{
      const snap=p.isLegacy
        ?await db.collection('surveys').get()
        :await db.collection('projects').doc(p.id).collection('responses').get();
      total=snap.size;
      const qLen=p.totalQuestions||p.questions?.length||5;
      snap.forEach(doc=>{
        const u=doc.data();
        if(u.progress>=qLen)completed++;
        else if(u.progress>0)inprog++;
      });
    }catch(e){}
    const notStarted=total-completed-inprog;
    const now=new Date();
    const isInRange=now>=new Date(p.startDate)&&now<=new Date(p.endDate+'T23:59:59');
    let statusLabel='草稿';let statusClass='badge-draft';
    if(p.status==='active'){statusLabel=isInRange?'▶ 執行中':'已過期';statusClass=isInRange?'badge-active':'badge-ended';}
    else if(p.status==='ended'){statusLabel='已結束';statusClass='badge-ended';}
    const modeLabel=p.answerMode==='all-at-once'?'一次全答':'每次答1題';
    const qLen=p.totalQuestions||p.questions?.length||0;
    const actionBtns=[
      `<button class="btn-sm navy" onclick="viewProjectStats('${p.id}')">📊 查看統計</button>`,
      `<button class="btn-sm ghost" onclick="openProjectForm('${p.id}')">✏️ 編輯</button>`,
    ];
    if(p.status!=='active')
      actionBtns.push(`<button class="btn-sm gold" onclick="setProjectStatus('${p.id}','active')">▶ 設為執行中</button>`);
    else
      actionBtns.push(`<button class="btn-sm danger" onclick="setProjectStatus('${p.id}','ended')">⏹ 結束專案</button>`);
    return `<div class="proj-card">
      <div class="proj-card-left">
        <div class="proj-name">${escHtml(p.name)} <span class="badge ${statusClass}">${statusLabel}</span></div>
        <div class="proj-period">📅 ${p.startDate} ～ ${p.endDate}</div>
        <div class="proj-mode">📌 ${qLen} 題 ｜ ${modeLabel}${(()=>{const ss=p.excludeSlots?.filter(s=>s.start&&s.end).map(s=>`${s.start}～${s.end}`).join('、');return ss?` ｜ 🚫 ${ss}`:''})()}　建立：${p.createdAt?p.createdAt.substring(0,10):'-'}</div>
      </div>
      <div class="proj-card-mid">
        <div class="proj-stat"><div class="proj-stat-val">${total}</div><div class="proj-stat-lbl">總登入</div></div>
        <div class="proj-stat"><div class="proj-stat-val" style="color:var(--green)">${completed}</div><div class="proj-stat-lbl">已完成</div></div>
        <div class="proj-stat"><div class="proj-stat-val" style="color:var(--orange)">${inprog+notStarted}</div><div class="proj-stat-lbl">未完成</div></div>
        <div class="proj-stat"><div class="proj-stat-val" style="color:var(--g400)">${total>0?Math.round(completed/total*100):0}%</div><div class="proj-stat-lbl">完成率</div></div>
      </div>
      <div class="proj-card-right">${actionBtns.join('')}</div>
    </div>`;
  }));
  container.innerHTML=`<div class="proj-list">${cards.join('')}</div>`;
}

async function setProjectStatus(projectId,status){
  if(status==='active'){
    if(!confirm('設為執行中後，前台將載入此專案題目。確定嗎？'))return;
    // Deactivate all other active projects
    const batch=db.batch();
    Object.keys(allProjects).forEach(id=>{
      if(id!==projectId&&allProjects[id].status==='active')
        batch.update(db.collection('projects').doc(id),{status:'ended'});
    });
    await batch.commit();
  }else if(status==='ended'){
    if(!confirm('確定結束此專案？前台將停止顯示此問卷。'))return;
  }
  await db.collection('projects').doc(projectId).update({status,updatedAt:new Date().toISOString()});
  await loadProjects();
  renderProjectsTab();
}

    </div>
    <div class="form-row">
      <div class="form-group" style="flex:2;min-width:220px">
        <label class="form-label">專案名稱 *</label>
        <input class="form-input" id="fProjName" value="${escAttr(p?.name||'')}" placeholder="如：2026年Q3投資理財調查">
      </div>
      <div class="form-group">
        <label class="form-label">開始日期 *</label>
        <input type="date" class="form-input" id="fStartDate" value="${p?.startDate||today}">
      </div>
      <div class="form-group">
        <label class="form-label">結束日期 *</label>
        <input type="date" class="form-input" id="fEndDate" value="${p?.endDate||''}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">作答方式 *</label>
        <div class="radio-group">
          <label class="radio-opt"><input type="radio" name="answerMode" value="one-per-login" ${p?.answerMode!=='all-at-once'?'checked':''}>每次登入答 1 題（下次登入再問下一題）</label>
          <label class="radio-opt"><input type="radio" name="answerMode" value="all-at-once" ${p?.answerMode==='all-at-once'?'checked':''}>一次全部作答完</label>

      </div>

    <div class="section-ttl" style="margin-top:8px">每日排除時段 <span style="font-size:11px;font-weight:400;color:var(--g400);letter-spacing:0">（選填，最多 2 個）</span></div>
    <div style="font-size:12px;color:var(--g600);line-height:1.65;padding:10px 14px;background:var(--g50);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;margin-bottom:14px">
      設定每日「不執行問卷」的登入時段。前台用戶在排除時段內登入時，問卷自動跳過不顯示。<br>
      <span style="color:var(--g400)">例：開盤時段 09:00～09:30、午休時段 12:00～13:30</span>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">排除時段 1　開始時間</label>
        <input type="time" class="form-input" id="fEx1Start" value="${escAttr(p?.excludeSlots?.[0]?.start||'')}">
      </div>
      <div class="form-group">
        <label class="form-label">排除時段 1　結束時間</label>

      </div>
      <div class="form-group">
        <label class="form-label">排除時段 2　開始時間</label>

      </div>
      <div class="form-group">
        <label class="form-label">排除時段 2　結束時間</label>

    <div class="upload-area" onclick="document.getElementById('txtUpload').click()">

function closeProjectForm(){
  const wrap=document.getElementById('projFormWrap');
  wrap.classList.remove('open');
  wrap.innerHTML='';
  editingProjectId=null;qEditorCount=0;
}

function addQuestion(q=null){
  qEditorCount++;
  const id=`qi_${Date.now()}_${qEditorCount}`;
  const type=q?.type||'single';
  const text=q?.q||'';
  const opts=q?.opts||['',''];
  const div=document.createElement('div');
  div.className='q-item';div.id=id;
  div.innerHTML=`
    <div class="q-item-head">
      <span class="q-num">第 ${document.querySelectorAll('#qList .q-item').length+1} 題</span>
      <select class="q-type-sel"><option value="single" ${type==='single'?'selected':''}>單選</option><option value="multi" ${type==='multi'?'selected':''}>複選</option></select>
      <button class="btn-del-q" onclick="document.getElementById('${id}').remove();updateQNums()">✕ 刪除</button>
    </div>
    <input class="q-text-input" placeholder="題目內容（必填）" value="${escAttr(text)}">
    <div class="opts-list" id="opts_${id}">${opts.map(o=>optItemHtml(o)).join('')}</div>
    <button class="btn-add-opt" onclick="addOpt('${id}')">＋ 新增選項</button>`;
  document.getElementById('qList').appendChild(div);
  updateQNums();
}

function optItemHtml(val=''){
  return `<div class="opt-item"><input class="opt-input" placeholder="選項文字（必填）" value="${escAttr(val)}"><button class="btn-del-opt" onclick="this.parentElement.remove()" title="刪除">×</button></div>`;
}

function addOpt(qid){
  document.getElementById(`opts_${qid}`).insertAdjacentHTML('beforeend',optItemHtml());
}

function updateQNums(){
  document.querySelectorAll('#qList .q-item').forEach((item,i)=>{
    item.querySelector('.q-num').textContent=`第 ${i+1} 題`;
  });
  const lbl=document.getElementById('qCountLabel');
  if(lbl)lbl.textContent=`${document.querySelectorAll('#qList .q-item').length} 題`;
}

function loadScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[src="${src}"]`)){res();return;}
    const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('載入失敗：'+src));
    document.head.appendChild(s);
  });
}

function importParsedQuestions(text){
  const qs=parseTxtQuestions(text);
  if(qs.length===0){alert('無法解析題目。\n請確認格式：每題以空行分隔，第一行 #single 或 #multi，第二行題目文字，後續每行一個選項。');return;}
  document.getElementById('qList').innerHTML='';qEditorCount=0;
  qs.forEach(q=>addQuestion(q));
  alert(`成功匯入 ${qs.length} 題`);
}

async function extractPdfText(arrayBuffer){
  const WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  pdfjsLib.GlobalWorkerOptions.workerSrc=WORKER;
  const pdf=await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  const allLines=[];
  for(let pn=1;pn<=pdf.numPages;pn++){
    const page=await pdf.getPage(pn);
    const content=await page.getTextContent();
    const rows={};
    content.items.forEach(item=>{
      const y=Math.round(item.transform[5]);
      if(!rows[y])rows[y]=[];
      rows[y].push({x:item.transform[4],str:item.str});
    });
    const ys=Object.keys(rows).map(Number).sort((a,b)=>b-a);
    let prevY=null;
    ys.forEach(y=>{
      if(prevY!==null&&prevY-y>18)allLines.push('');
      const txt=rows[y].sort((a,b)=>a.x-b.x).map(i=>i.str).join('').trim();
      if(txt)allLines.push(txt);
      prevY=y;
    });
    allLines.push('');
  }
  return allLines.join('\n');
}

async function parseTxtUpload(input){
  const file=input.files[0];if(!file)return;
  input.value='';
  const ext=file.name.split('.').pop().toLowerCase();
  if(ext==='txt'){
    const reader=new FileReader();
    reader.onload=e=>importParsedQuestions(e.target.result);
    reader.readAsText(file,'UTF-8');
  }else if(ext==='docx'){
    try{
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
      const buf=await file.arrayBuffer();
      const result=await mammoth.extractRawValue({arrayBuffer:buf});
      importParsedQuestions(result.value);
    }catch(e){alert('Word 檔解析失敗：'+e.message);}
  }else if(ext==='pdf'){
    try{
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
      const buf=await file.arrayBuffer();
      const text=await extractPdfText(buf);
      importParsedQuestions(text);
    }catch(e){alert('PDF 解析失敗：'+e.message);}
  }else{
    alert('不支援的檔案格式，請上傳 TXT、Word (.docx) 或 PDF 檔案。');
  }
}

function parseTxtQuestions(text){
  const qs=[];
  const blocks=text.split(/\n\s*\n/);
  blocks.forEach(block=>{
    const lines=block.trim().split('\n').map(l=>l.trim()).filter(l=>l);
    if(lines.length<3)return;
    const t=lines[0].toLowerCase();
    const type=t.includes('multi')?'multi':'single';
    const q=lines[1];
    const opts=lines.slice(2).map(l=>l.replace(/^[-•*\d+\.]\s*/,''));
    if(q&&opts.length>=2)qs.push({type,q,opts});
  });
  return qs;
}

function collectQuestions(){
  const items=document.querySelectorAll('#qList .q-item');
  const qs=[];
  items.forEach((item,i)=>{
    const type=item.querySelector('.q-type-sel').value;
    const q=item.querySelector('.q-text-input').value.trim();
    const opts=Array.from(item.querySelectorAll('.opt-input')).map(inp=>inp.value.trim()).filter(v=>v);
    if(q&&opts.length>=2)qs.push({id:i+1,type,q,opts});
  });
  return qs;
}

async function submitProjectForm(){
  const name=document.getElementById('fProjName').value.trim();
  const startDate=document.getElementById('fStartDate').value;
  const endDate=document.getElementById('fEndDate').value;
  const answerMode=document.querySelector('input[name="answerMode"]:checked').value;
  const questions=collectQuestions();
  if(!name){alert('請輸入專案名稱');return;}
  if(!startDate||!endDate){alert('請設定執行期間');return;}
  if(startDate>endDate){alert('結束日期不能早於開始日期');return;}
  if(questions.length===0){alert('請至少新增一道題目（每題需有題目文字及至少 2 個選項）');return;}
  const excludeSlots=[];
  for(let i=1;i<=2;i++){
    const s=document.getElementById(`fEx${i}Start`).value;
    const e=document.getElementById(`fEx${i}End`).value;
    if(s||e){
      if(!s||!e){alert(`排除時段 ${i}：開始與結束時間必須同時填寫`);return;}
      if(s>=e){alert(`排除時段 ${i}：結束時間必須晚於開始時間`);return;}
      excludeSlots.push({start:s,end:e});
    }
  }
  const data={name,startDate,endDate,answerMode,questions,totalQuestions:questions.length,excludeSlots,updatedAt:new Date().toISOString()};
  try{
    if(editingProjectId){
      await db.collection('projects').doc(editingProjectId).update(data);
      alert('專案已更新');
    }else{
      data.status='draft';data.createdAt=new Date().toISOString();
      await db.collection('projects').add(data);
      alert('專案已建立（狀態：草稿）\n請在專案清單中點「設為執行中」讓前台載入此問卷。');
    }
    closeProjectForm();
    await loadProjects();
    renderProjectsTab();
  }catch(e){alert('儲存失敗：'+e.message);}
}
