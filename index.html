<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  /* ── CI 色彩 ── */
  --navy:#002349;
  --navy-m:#003366;
  --gold:#BD9A1B;
  --gold-l:#D4B432;
  --gold-pale:#FBF6E3;
  --white:#FFFFFF;
  --g50:#F8FAFC;--g100:#F1F5F9;--g200:#E2E8F0;
  --g400:#94A3B8;--g500:#64748B;--g600:#475569;--g800:#1E293B;

  /* ── Q2/Q4 配色：深林綠 + 酒紅 ── */
  --grn:#1A5638;
  --burg:#6B1A2E;

  /* ── Progress-bar segment colors ── */
  --seg0a:#002349;--seg0b:#BD9A1B;--seg0c:#0A3A6A;--seg0d:#9E7E14;
  --seg1a:#1A5638;--seg1b:#6B1A2E;--seg1c:#124028;--seg1d:#52142A;
}

/* ═══════════════════════════════
   BASE — 透明底色，不遮手機畫面
═══════════════════════════════ */
html,body{
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif;
  background:transparent;
  /* In a browser this shows white; in a mobile WebView the wallpaper shows through */
}

/* VIEWS */
.view{display:none;min-height:100vh;width:100%;}
.view.active{display:flex;flex-direction:column;}

/* LOGIN + STATUS — keep dark navy background */
#loginView,#dismissedView,#completedView{
  background:linear-gradient(150deg,#011530 0%,var(--navy) 50%,#011530 100%);
  position:relative;
}
#loginView::after,#dismissedView::after,#completedView::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(189,154,27,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(189,154,27,.045) 1px,transparent 1px);
  background-size:44px 44px;
}

/* SURVEY — semi-transparent overlay, card anchored to bottom */
#surveyView{
  position:fixed !important;
  inset:0;
  min-height:unset !important;
  background:rgba(0,23,49,.52);
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
}

/* ═══════════════════════════════
   LOGIN
═══════════════════════════════ */
#loginView{justify-content:center;align-items:center;padding:20px;}
.login-card{
  width:100%;max-width:400px;background:#fff;border-radius:20px;
  box-shadow:0 24px 64px rgba(0,0,0,.4),0 0 0 1px rgba(189,154,27,.2);
  overflow:hidden;position:relative;z-index:1;
}
.lc-head{
  background:linear-gradient(145deg,#011530 0%,var(--navy) 55%,var(--navy-m) 100%);
  padding:30px 24px 26px;text-align:center;position:relative;
}
.lc-head::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:64px;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-l));border-radius:2px;}

.lc-logo{display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.lc-logo svg{height:46px;width:auto;color:var(--gold);}
.lc-subtitle{color:rgba(255,255,255,.5);font-size:12px;letter-spacing:1.5px;margin-top:8px;}
.lc-body{padding:26px 24px 18px;}
.form-group{margin-bottom:15px;}
.form-lbl{display:block;font-size:12px;font-weight:700;color:var(--g600);margin-bottom:5px;letter-spacing:.5px;}
.form-ctrl{width:100%;padding:11px 14px;border:1.5px solid var(--g200);border-radius:10px;font-size:15px;color:var(--g800);background:var(--g50);outline:none;transition:all .2s;font-family:inherit;}
.form-ctrl:focus{border-color:var(--navy);background:#fff;box-shadow:0 0 0 3px rgba(0,35,73,.09);}
.btn-login{width:100%;padding:13px;background:linear-gradient(135deg,#011530,var(--navy-m));color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:2px;transition:all .2s;font-family:inherit;position:relative;overflow:hidden;}
.btn-login::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-l));}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,35,73,.4);}
.login-err{margin-top:10px;padding:9px 12px;background:#FEF2F2;border:1px solid #FCA5A5;border-radius:8px;color:#DC2626;font-size:12.5px;display:none;}
.lc-foot{text-align:center;padding:10px 20px 16px;font-size:10.5px;color:var(--g400);line-height:1.6;border-top:1px solid var(--g100);}

/* ═══════════════════════════════
   SURVEY — bottom-sheet overlay
   顯示區間：螢幕下方 1/3 ~ 1/2
═══════════════════════════════ */
#surveyView{
  justify-content:center;
  align-items:center;
  padding:16px 14px;
  animation:backdropIn .22s ease both;
}
@keyframes backdropIn{
  from{background:rgba(0,23,49,0);backdrop-filter:blur(0px);}
  to{background:rgba(0,23,49,.52);backdrop-filter:blur(3px);}
}

/* sheet handle（置中模式改為裝飾性細線） */
.sheet-handle{
  width:36px;height:3px;
  background:rgba(0,0,0,.08);
  border-radius:2px;
  margin:8px auto 2px;
  flex-shrink:0;
}
/* progress dots — inside bottom sheet */
.dot-nav{display:flex;justify-content:center;gap:5px;margin:0;padding:2px 0 6px;flex-shrink:0;}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(0,35,73,.2);transition:all .3s;}
.dot.done{background:var(--gold);opacity:.9;}
.dot.active{background:var(--navy);width:22px;border-radius:4px;}

/* ── SURVEY CARD — Bottom Sheet ──
   從螢幕底部滑上，佔手機版面 1/3 ~ 1/2
*/
.survey-card{
  width:100%;max-width:440px;
  background:#fff;
  border-radius:18px;
  box-shadow:0 8px 40px rgba(0,23,49,.38),0 0 0 1px rgba(189,154,27,.15);
  overflow:hidden;display:flex;flex-direction:column;
  max-height:72vh;
  animation:cardIn .28s cubic-bezier(.4,0,.2,1) both;
}
@keyframes cardIn{
  from{opacity:0;transform:scale(.96) translateY(12px);}
  to{opacity:1;transform:scale(1) translateY(0);}
}

/* ── Question header (matches uploaded image) ──
   Left: white bg · outlined bull · PRIMASIA · 犇亞證券
   Right: navy bg · 投資理財調查 white bold
*/
.q-header{
  display:flex;align-items:stretch;flex-shrink:0;
  border-bottom:1px solid var(--g200);
}
.qh-brand{
  flex:1;                         /* 白底佔 50% */
  display:flex;align-items:center;justify-content:center;
  padding:10px 10px;background:#fff;
  border-right:2px solid var(--navy);
  overflow:hidden;
}
.qh-logo{
  height:40px;width:auto;         /* Logo 放大 */
  color:var(--navy);display:block;
  max-width:100%;flex-shrink:1;
}
.qh-title{
  flex:1;background:var(--navy);color:#fff;  /* 藍底佔 50% */
  font-size:15px;font-weight:700;letter-spacing:3px;
  display:flex;align-items:center;justify-content:center;
  padding:10px 8px;text-align:center;
}

/* Question text area */
.q-row{padding:12px 14px 6px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-shrink:0;}
.q-text-wrap{flex:1;}
.q-text{font-size:14px;font-weight:700;color:var(--navy);line-height:1.4;}
.q-sub{font-size:11px;color:var(--g400);font-weight:400;margin-left:4px;}
.btn-x{width:26px;height:26px;background:var(--g100);border:none;border-radius:50%;color:var(--g400);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-family:inherit;}
.btn-x:hover{background:var(--g200);color:var(--g800);}

/* Segmented progress bar */
.prog-wrap{padding:0 14px 8px;flex-shrink:0;}
.prog-bar{height:7px;border-radius:4px;overflow:hidden;display:flex;background:var(--g100);margin-bottom:4px;}
.prog-seg{height:100%;transition:width .6s ease;}
.prog-labels{display:flex;}
.prog-lbl{font-size:9.5px;font-weight:700;text-align:center;overflow:hidden;transition:width .6s ease;padding:0 1px;}


/* Options */
.opts-scroll{overflow-y:auto;flex:1;padding:0 10px 2px;-webkit-overflow-scrolling:touch;}
.opts-scroll::-webkit-scrollbar{width:3px;}
.opts-scroll::-webkit-scrollbar-thumb{background:var(--g200);border-radius:2px;}
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:4px;}

.opt-btn{
  position:relative;padding:0 8px;border:none;border-radius:10px;
  font-size:12.5px;font-weight:600;cursor:pointer;
  line-height:1.35;text-align:center;
  transition:transform .15s,box-shadow .15s,filter .15s,outline .1s;
  font-family:inherit;min-height:52px;height:auto;
  display:flex;align-items:center;justify-content:center;
  word-break:keep-all;
}
.opt-btn.sel{outline:3px solid rgba(255,255,255,.85);outline-offset:-3px;box-shadow:0 4px 14px rgba(0,0,0,.28);transform:translateY(-2px);}
.opt-btn.sel::after{content:'✓';position:absolute;top:5px;right:7px;font-size:9.5px;font-weight:900;background:rgba(255,255,255,.3);border-radius:50%;width:14px;height:14px;display:flex;align-items:center;justify-content:center;line-height:1;}
.opt-btn:hover{filter:brightness(1.22);}

.q-note{font-size:10px;color:#CC2929;padding:4px 14px 2px;line-height:1.5;flex-shrink:0;display:none;}
.sc-count{text-align:center;padding:2px 0 2px;font-size:9px;color:rgba(148,163,184,.55);flex-shrink:0;letter-spacing:.3px;}

/* Submit */
.sc-foot{padding:7px 10px 10px;flex-shrink:0;}
.btn-submit{
  width:100%;padding:11px;
  background:#002349;
  color:#fff;border:none;border-radius:10px;
  font-size:14px;font-weight:700;cursor:pointer;
  letter-spacing:2px;transition:all .2s;font-family:inherit;
  position:relative;overflow:hidden;
}
.btn-submit::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-l));}
.btn-submit:disabled{background:#4a6d99;cursor:not-allowed;}
.btn-submit:not(:disabled):hover{filter:brightness(1.18);transform:translateY(-1px);box-shadow:0 5px 16px rgba(0,35,73,.4);}

/* ═══════════════════════════════
   STATUS CARDS
═══════════════════════════════ */
#dismissedView,#completedView{justify-content:center;align-items:center;padding:24px;}
.stat-card{width:100%;max-width:380px;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;text-align:center;position:relative;z-index:1;}
.stat-top{background:linear-gradient(145deg,#011530,var(--navy-m));padding:22px 24px 20px;}
.stat-logo{display:flex;align-items:center;justify-content:center;}
.stat-logo svg{height:34px;width:auto;color:var(--gold);}
.gold-bar{height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 20px;}
.stat-body{padding:26px 22px 22px;}
.stat-ico{font-size:44px;display:block;margin-bottom:14px;}
.stat-ttl{font-size:19px;font-weight:700;color:var(--navy);margin-bottom:9px;}
.stat-msg{font-size:13px;color:var(--g600);line-height:1.65;margin-bottom:20px;}
.stat-tag{display:inline-block;padding:7px 18px;background:var(--gold-pale);border:1px solid rgba(189,154,27,.3);border-radius:20px;font-size:12px;color:#7A5C00;font-weight:600;margin-bottom:20px;}
.btn-back{width:100%;padding:12px;background:linear-gradient(135deg,#011530,var(--navy-m));color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;position:relative;overflow:hidden;}
.btn-back::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2.5px;background:linear-gradient(90deg,var(--gold),var(--gold-l));}
.btn-back:hover{opacity:.9;}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
/* survey-card 使用 slideUp，不用 fadeUp */
.view.active .login-card,.view.active .stat-card{animation:fadeUp .3s ease both;}

/* ── RESPONSIVE ── */
/* 小螢幕（< 380px） */
@media(max-width:380px){
  .survey-card{max-height:78vh;}
  .opt-btn{font-size:12px;min-height:48px;}
  .q-text{font-size:13px;}
}
/* 高螢幕（>= 760px，如 iPhone Pro Max） */
@media(min-height:760px){.survey-card{max-height:68vh;}}
/* 平板 / 桌面 */
@media(min-width:768px){
  .survey-card{max-width:460px;max-height:65vh;}
}
</style>

let currentUser=null,selectedOpts=[];
let allUsersCache=null;
let activeProject=null; // 目前執行中的問卷專案（從 Firestore projects 集合載入）

function loadData(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||{users:{}};}catch(e){return{users:{}};}}
function saveData(d){localStorage.setItem(STORE_KEY,JSON.stringify(d));}
function getUser(id){
  const d=loadData();
  if(!d.users[id]){
    // Migrate data stored under a different-case key (e.g. T100000015 → t100000015)
    const altKey=Object.keys(d.users).find(k=>k.toLowerCase()===id.toLowerCase()&&k!==id);
    if(altKey){d.users[id]=d.users[altKey];delete d.users[altKey];saveData(d);}
  }
  if(!d.users[id])d.users[id]={progress:0,answers:{},dismissedUntil:null,completedAt:null,firstLogin:new Date().toISOString(),loginCount:0};
  return d.users[id];
}

// 取得當前應使用的題目（專案題目優先，否則 fallback 至硬編碼 QUESTIONS）
function getQuestions(){return(activeProject?.questions?.length>0)?activeProject.questions:QUESTIONS;}

// 取得回應寫入的 Firestore collection ref
function responsesCol(){
  return activeProject
    ?db.collection('projects').doc(activeProject.id).collection('responses')
    :db.collection('surveys');
}

function setUser(id,u){
  const d=loadData();d.users[id]=u;saveData(d);
  responsesCol().doc(id).set(u).catch(e=>console.warn('雲端儲存失敗:',e));
  if(allUsersCache) allUsersCache.users[id]=u;
}

// 從 Firestore 載入執行中的問卷專案
async function loadActiveProject(){
  try{
    const snap=await db.collection('projects').where('status','==','active').get();
    if(!snap.empty){
      const now=new Date();
      for(const doc of snap.docs){
        const p=doc.data();
        const start=new Date(p.startDate);
        const end=new Date(p.endDate+'T23:59:59');
        if(now>=start&&now<=end){
          activeProject={id:doc.id,...p};
          return activeProject;
        }
      }
    }
  }catch(e){console.warn('無法載入問卷專案，使用預設題目:',e);}
  activeProject=null;
  return null;
}

function isInExclusionSlot(project){
  if(!project?.excludeSlots?.length)return false;
  const now=new Date();
  const cur=now.getHours()*60+now.getMinutes();
  return project.excludeSlots.some(slot=>{
    if(!slot.start||!slot.end)return false;
    const[sh,sm]=slot.start.split(':').map(Number);
    const[eh,em]=slot.end.split(':').map(Number);
    return cur>=sh*60+sm&&cur<eh*60+em;
  });
}

function getDistribution(qi){
  const data=allUsersCache||loadData();
  const q=getQuestions()[qi];
  if(!q)return{counts:{},responders:0};
  const counts={};q.opts.forEach(o=>counts[o]=0);let responders=0;
  Object.values(data.users).forEach(u=>{
    if(u.answers&&u.answers[qi]!==undefined){
      responders++;const ans=u.answers[qi];
      if(Array.isArray(ans))ans.forEach(v=>{if(counts[v]!==undefined)counts[v]++;});
      else if(counts[ans]!==undefined)counts[ans]++;
    }
  });
  return{counts,responders};
}

function showView(v){document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));document.getElementById(v).classList.add('active');window.scrollTo(0,0);}
function backToLogin(){currentUser=null;document.getElementById('loginId').value='';document.getElementById('loginPwd').value='';showView('loginView');}

// ══════════════════════════════════════════════════════
//  JavaScript Interface Bridge — APP 串接通知機制
//  支援：React Native WebView / iOS WKWebView / Android
// ══════════════════════════════════════════════════════
function notifyNative(type, payload){
  const data = Object.assign({type: type}, payload || {});
  const msg  = JSON.stringify(data);
  try{
    // ① React Native WebView（現行 APP 主要使用，與 estockking 相容）
    if(window.ReactNativeWebView && typeof window.ReactNativeWebView.postMessage==='function'){
      window.ReactNativeWebView.postMessage(msg); return;
    }
    // ② iOS WKWebView（handler 名稱：surveyClosed）
    if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.surveyClosed){
      window.webkit.messageHandlers.surveyClosed.postMessage(data); return;
    }
    // ③ Android 原生介面（addJavascriptInterface，bridge 名稱：AndroidBridge）
    if(window.AndroidBridge && typeof window.AndroidBridge.onSurveyEvent==='function'){
      window.AndroidBridge.onSurveyEvent(msg); return;
    }
  }catch(_){}
  // ④ 純瀏覽器 fallback：無需通知，維持原有畫面切換行為
}

async function doLogin(){
  const id=document.getElementById('loginId').value.trim().toLowerCase();
  const pw=document.getElementById('loginPwd').value;
  const err=document.getElementById('loginErr');
  if(!CREDS[id]||CREDS[id]!==pw){err.style.display='block';return;}
  err.style.display='none';currentUser=id;

  // 載入執行中專案（決定題目內容及作答方式）
  await loadActiveProject();
  const questions=getQuestions();

  // 從 Firestore 載入個人進度（比較小寫/大寫兩個 doc，取進度較大者）
  try{
    const col=responsesCol();
    const [lowerSnap,upperSnap]=await Promise.all([
      col.doc(id).get(),
      col.doc(id.toUpperCase()).get()
    ]);
    const lowerProg=lowerSnap.exists?(lowerSnap.data().progress||0):0;
    const upperProg=upperSnap.exists?(upperSnap.data().progress||0):0;
    const bestSnap=upperProg>lowerProg?upperSnap:(lowerSnap.exists?lowerSnap:null);
    if(bestSnap){
      const fsData=bestSnap.data();
      const d=loadData();
      if(!d.users[id]||(fsData.progress||0)>(d.users[id].progress||0)){
        d.users[id]=fsData;saveData(d);
      }
    }
  }catch(e){}

  const u=getUser(id);u.loginCount=(u.loginCount||0)+1;u.lastLogin=new Date().toISOString();
  if(u.progress>=questions.length){
    setUser(id,u);
    notifyNative('SURVEY_ALREADY_DONE',{userId:id,completedAt:u.completedAt||null});
    return;
  }
  if(u.dismissedUntil){
    const until=new Date(u.dismissedUntil);
    if(new Date()<until){
      setUser(id,u);const m=until.getMonth()+1,dy=until.getDate();
      document.getElementById('dismissedUntilText').textContent=`將於 ${m} 月 ${dy} 日後再次提醒`;
      showView('dismissedView');return;
    }
    u.dismissedUntil=null;
  }
  if(activeProject&&isInExclusionSlot(activeProject)){
    setUser(id,u);
    notifyNative('SURVEY_TIME_EXCLUDED',{userId:id,excludedAt:new Date().toISOString()});
    currentUser=null;
    return;
  }
  // 從 Firestore 預載所有用戶回答，供分佈統計使用
  try{
    const snap=await responsesCol().get();
    const users={};
    snap.forEach(doc=>{users[doc.id]=doc.data();});
    allUsersCache={users};
  }catch(e){
    allUsersCache=loadData();
  }
  setUser(id,u);renderSurvey(u.progress);showView('surveyView');
}
document.getElementById('loginId').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginPwd').focus();});
document.getElementById('loginPwd').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

function renderSurvey(qi){
  const questions=getQuestions();
  const q=questions[qi];selectedOpts=[];
  const palette=Q_PALETTE[qi%Q_PALETTE.length];
  const segColors=Q_SEG[qi%Q_SEG.length];

  // Dots
  document.getElementById('dotNav').innerHTML=questions.map((_,i)=>{
    let c='dot';if(i<qi)c+=' done';if(i===qi)c+=' active';return `<div class="${c}"></div>`;
  }).join('');

  // Question (sub text inline after question)
  document.getElementById('qText').innerHTML=q.q+(q.sub?`<span class="q-sub">${q.sub}</span>`:'');

  // Progress bar
  const{counts,responders}=getDistribution(qi);
  const total=q.type==='multi'?Object.values(counts).reduce((a,b)=>a+b,0)||1:responders||1;
  const pb=document.getElementById('progBar'),pl=document.getElementById('progLabels');
  pb.innerHTML='';pl.innerHTML='';
  if(responders===0){
    const w=(100/q.opts.length).toFixed(1);
    q.opts.forEach((_,i)=>{
      const s=document.createElement('div');s.className='prog-seg';
      s.style.cssText=`width:${w}%;background:${segColors[i%4]};opacity:.18;`;pb.appendChild(s);
    });
    pl.innerHTML='<span style="width:100%;text-align:center;font-size:10px;color:#94A3B8">—</span>';
  }else{
    q.opts.forEach((o,i)=>{
      const pct=Math.round(counts[o]/total*100);
      const s=document.createElement('div');s.className='prog-seg';
      s.style.cssText=`width:${pct}%;background:${segColors[i%4]};`;pb.appendChild(s);
      const l=document.createElement('span');l.className='prog-lbl';
      l.style.cssText=`width:${pct}%;color:${segColors[i%4]};`;
      l.textContent=pct>6?pct+'%':'';pl.appendChild(l);
    });
  }

  // Reset pointer-events (may have been disabled by previous single-select auto-submit)
  document.getElementById('optsGrid').style.pointerEvents='';

  // Option buttons with per-question colours
  document.getElementById('optsGrid').innerHTML=q.opts.map((o,i)=>{
    const[bg,fg]=palette[i%4];
    return `<button class="opt-btn"
      style="background:${bg};color:${fg};"
      data-bg="${bg}" data-val="${o.replace(/"/g,'&quot;')}"
      onclick="toggleOpt(this,'${q.type}')">${o}</button>`;
  }).join('');

  const noteEl=document.getElementById('qNote');
  if(q.note){noteEl.textContent=q.note;noteEl.style.display='block';}else{noteEl.textContent='';noteEl.style.display='none';}
  document.getElementById('scCount').textContent=responders>0?`已有 ${responders} 人回答`:'';
  document.getElementById('btnSubmit').disabled=true;
  document.getElementById('btnSubmit').parentElement.style.display=q.type==='multi'?'':'none';
}

function toggleOpt(btn,type){
  const val=btn.getAttribute('data-val');
  if(type==='single'){
    document.querySelectorAll('#optsGrid .opt-btn').forEach(b=>b.classList.remove('sel'));
    btn.classList.add('sel');selectedOpts=[val];
    document.getElementById('optsGrid').style.pointerEvents='none';
    setTimeout(submitAnswer,380);
  }else{
    if(btn.classList.contains('sel')){btn.classList.remove('sel');selectedOpts=selectedOpts.filter(v=>v!==val);}
    else{btn.classList.add('sel');selectedOpts.push(val);}
  }
  document.getElementById('btnSubmit').disabled=selectedOpts.length===0;
}

function submitAnswer(){
  if(!selectedOpts.length)return;
  const questions=getQuestions();
  const u=getUser(currentUser);const q=questions[u.progress];
  const ans=q.type==='multi'?[...selectedOpts]:selectedOpts[0];
  u.answers[u.progress]=ans;u.progress++;

  // 舊版相容：Q4（index 3）答「目前沒有意願」→ 跳過 Q5，直接結束
  if(u.progress===4&&ans==='目前沒有意願'&&questions.length===5){
    u.progress=questions.length;
  }

  if(u.progress>=questions.length){
    u.completedAt=new Date().toISOString();
    setUser(currentUser,u);
    notifyNative('SURVEY_COMPLETED',{userId:currentUser,completedAt:u.completedAt});
    setTimeout(backToLogin,400);
  }else{
    setUser(currentUser,u);
    // 作答方式：一次全答 → 繼續下一題；每次答1題 → 回登入頁
    const mode=activeProject?.answerMode||'one-per-login';
    if(mode==='all-at-once'){
      renderSurvey(u.progress);
    }else{
      backToLogin();
    }
  }
}

function dismissSurvey(){
  if(!currentUser)return;
  const u=getUser(currentUser);const until=new Date();until.setDate(until.getDate()+3);
  u.dismissedUntil=until.toISOString();setUser(currentUser,u);
  const m=until.getMonth()+1,dy=until.getDate();
  document.getElementById('dismissedUntilText').textContent=`將於 ${m} 月 ${dy} 日後再次提醒`;
  // 【串接點 C】用戶選擇暫不填寫 → 通知 APP 關閉 WebView
  notifyNative('SURVEY_DISMISSED',{userId:currentUser,dismissedUntil:u.dismissedUntil});
  currentUser=null;showView('dismissedView');
}
